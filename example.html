<!DOCTYPE html>
<html>
<head>
  <!-- Add AOS CSS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
  <!-- Animated section -->
  <section 
    data-aos="fade-up" 
    data-aos-duration="1000"
    data-aos-delay="200"
  >
    <h1>Your Content Here</h1>
    <p>This will fade up when scrolled to</p>
  </section>

  <!-- Add AOS JS at end of body -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
  <script src="js/main.js"></script>
</body>
</html>
